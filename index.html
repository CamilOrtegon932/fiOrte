    row('Intereses restantes', money(b.int), x => money(x.int), x => money(x.int)),
    ...(P.ins ? [row('Seguro y otros cargos restantes', money(b.ins), x => money(x.ins), x => money(x.ins))] : []),
    row('Total desde hoy (incluye el abono)', money(b.total), x => money(x.total), x => money(x.total)),
    row('Ahorro estimado vs. plan actual', '—', x => money(x.dInt + x.dIns), x => money(x.dInt + x.dIns), 'sv')].join('');
  return `<table class="simtbl"><thead><tr><th>Abono de ${money(sel.A)}</th>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
    ${liq ? '<div class="simfoot">Para liquidar, tu entidad normalmente cobra además los intereses causados desde la última cuota: pide el valor de «pago total».</div>' : ''}${regBtn}`;
}
function simMulti(l, P, oks, sel){
  if (P.mode !== 'full' && P.mode !== 'limited') return '';
  const showP = P.adm !== 'cuota', showC = P.adm !== 'plazo';
  const body = oks.map(r => { const sc = r.sc; const pz = sc.plazo, cu = sc.cuota;
    return `<tr class="pick ${r.i === sel.i ? 'on' : ''}" data-a="simsel" data-id="${l.id}" data-i="${r.i}"><td>${money(r.A)}</td><td>${money(sc.B2)}</td>${showP ? `<td>${pz ? (sc.liquid ? 'Liquida' : nq(pz.n) + (pz.dN ? ` (−${pz.dN})` : '')) : 'n/d'}</td><td>${pz ? money(pz.dInt) : 'n/d'}</td>` : ''}${showC ? `<td>${cu ? (sc.liquid ? 'Liquida' : money(cu.c)) : 'n/d'}</td><td>${cu ? money(cu.dInt) : 'n/d'}</td>` : ''}</tr>`; }).join('');
  return `<table class="simtbl"><thead><tr><th>Comparar importes</th><th>Saldo después</th>${showP ? '<th>Mantener cuota:<br>cuotas</th><th>Intereses ahorrados</th>' : ''}${showC ? '<th>Reducir cuota:<br>nueva cuota</th><th>Intereses ahorrados</th>' : ''}</tr></thead><tbody>
    <tr><td>Plan actual</td><td>${money(P.B)}</td>${showP ? `<td>${nq(P.base.n)}</td><td>—</td>` : ''}${showC ? `<td>${money(P.c)}</td><td>—</td>` : ''}</tr>${body}</tbody></table><div class="simfoot">Toca una fila para ver su detalle completo.</div>`;
}
function simResHTML(l){
  const st = simSt(l.id), P = simPlan(l);
  if (P.mode === 'paid') return '';
  const rows = st.amts.map((x, i) => ({ i, ...simCheck(x, P.B) }));
  let h = rows.filter(r => r.state === 'err').map(r => `<div class="simerr">Abono ${r.i + 1}: ${r.msg}</div>`).join('');
  const oks = rows.filter(r => r.state === 'ok').map(r => ({ ...r, sc:simScenario(P, r.A) }));
  if (!oks.length) return h + (h ? '' : '<div class="simfoot">Escribe un importe para ver la simulación. Nada de lo que escribas aquí se registra como pago.</div>');
  const sel = oks.find(r => r.i === st.sel) || oks[0];
  h += simDetail(l, P, sel) + (oks.length > 1 ? simMulti(l, P, oks, sel) : '');
  if (P.mode === 'full' || P.mode === 'limited') h += P.notes.map(n => `<div class="simb warn">${n}</div>`).join('');
  h += `<div class="simfoot"><b>Estimado, no oficial.</b> Tu entidad puede recalcular la cuota o el plazo de otra forma, cobrar comisiones o intereses causados, o aplicar el abono en otra fecha. El resultado real depende de sus condiciones.</div>`;
  return h;
}
function simPanelHTML(l){
  const P = simPlan(l), st = simSt(l.id);
  const chips = [50000, 100000, 200000, 500000].filter(v => v < P.B).map(v => `<button class="tchip" data-a="simchip" data-id="${l.id}" data-v="${v}">${money(v)}</button>`).join('') + `<button class="tchip" data-a="simchip" data-id="${l.id}" data-v="${P.B}">Todo el saldo</button>`;
  const inputs = st.amts.map((x, i) => `<label>${i === 0 ? 'Abono a simular' : 'Comparar con (opcional)'}<input data-sim="${l.id}" data-i="${i}" inputmode="numeric" autocomplete="off" placeholder="$ 0" value="${esc(x)}"></label>`).join('');
  return `<div class="sim"><h5>Simulador de abono extraordinario</h5>
    ${simBanner(P)}${simDataHTML(l, P)}
    <div class="btns" style="margin:0 0 4px"><button class="btn btn-soft btn-sm" data-a="edit" data-k="loans" data-id="${l.id}">Editar datos para simular</button></div>
    <div class="simin">${inputs}</div><div class="simchips">${chips}</div>
    <div id="simres-${l.id}">${simResHTML(l)}</div>
    <details><summary>Cómo se calcula</summary>
      <p>Tasa mensual: i = (1 + E.A.)<sup>1/12</sup> − 1. Cada mes: interés = saldo × i; capital = cuota (sin seguro) − interés; saldo nuevo = saldo − capital. La última cuota es lo que falte.</p>
      <p><b>Mantener la cuota:</b> se simula mes a mes con el saldo menor hasta llegar a 0. <b>Reducir la cuota:</b> se conservan las cuotas restantes del plan y la nueva cuota es C = S·i / (1 − (1+i)<sup>−n</sup>). El seguro se suma aparte y se supone fijo por cuota.</p>
      <p>Se supone un abono hecho justo después de pagar una cuota, sin comisiones, con cuota fija y sin cobros adicionales. Con la tasa implícita, i se despeja de tu saldo, tu cuota y tus cuotas restantes.</p></details></div>`;
}

function vPrestamos(){
  const infos = S.loans.map(l => ({l, i:loanInfo(l)}));
  const T0 = { principal:sum(S.loans, l => l.principal), balance:sum(infos, x => x.i.balance), capital:sum(infos, x => x.i.capital), interest:sum(infos, x => x.i.interest), insurance:sum(infos, x => x.i.insurance), toPay:sum(infos, x => x.i.toPay), fees:sum(S.loans, l => l.fee) };
  const hist = []; for (let i = 5; i >= 0; i--) hist.push(shift(ui.month, -i));
  const byM = hist.map(m => { const ps = S.loans.flatMap(l => l.payments.filter(p => p.date.slice(0,7) === m)); return { c:sum(ps, p => p.capital||0), i:sum(ps, p => p.interest||0), s:sum(ps, p => p.insurance||0) }; });
  const spent = T0.capital + T0.interest + T0.insurance;
  const dash = !S.loans.length ? '' : `
  <div class="grid g5">
    ${kpi('Deuda de capital', money(T0.balance), `de ${money(T0.principal)} prestados`, 'neg')}
    ${kpi('Capital pagado', money(T0.capital), '', 'pos')}
    ${kpi('Intereses pagados', money(T0.interest), 'Costo del dinero')}
    ${kpi('Seguros de vida', money(T0.insurance), '')}
    ${kpi('Cuotas mensuales', money(T0.fees), `${S.loans.length} préstamo(s)`)}
  </div>
  <div class="grid g2">
    <div class="card"><h3>¿A dónde se ha ido el dinero? <span>Total acumulado</span></h3>${donut([{label:'Abono a capital', value:T0.capital, color:'#30b455'},{label:'Intereses', value:T0.interest, color:'#ff5a52'},{label:'Seguro de vida', value:T0.insurance, color:'#ff9f0a'}], money(spent).replace('$ ','$'), 'pagado en total')}</div>
    <div class="card"><h3>Pagos por mes <span>Últimos 6 meses</span></h3>${barChart({labels:hist.map(m => monthName(m,true)), stacked:true, series:[{name:'Capital', color:'#30b455', values:byM.map(x => x.c)},{name:'Intereses', color:'#ff5a52', values:byM.map(x => x.i)},{name:'Seguro', color:'#ff9f0a', values:byM.map(x => x.s)}], h:210})}
      <div class="key"><span><i style="background:#30b455"></i>Capital</span><span><i style="background:#ff5a52"></i>Intereses</span><span><i style="background:#ff9f0a"></i>Seguro</span></div></div>
  </div>`;
  const cards = infos.map(({l, i}) => `
    <div class="card loan ${simSt(l.id).open && i.balance > 0 ? 'wide' : ''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h4>${esc(l.name)}</h4><div class="sub">Cuota ${i.paidFees} de ${l.term} · faltan ${i.left}</div></div><div>${delBtn('loans', l.id)}</div></div>
      <div class="meta">
        <div><span>Monto del préstamo</span><b>${money(l.principal)}</b></div>
        <div><span>Cuota mensual</span><b>${money(l.fee)}</b></div>
        <div><span>Saldo de capital</span><b class="neg">${money(i.balance)}</b></div>
        <div><span>Falta por pagar (cuotas)</span><b>${money(i.toPay)}</b></div>
      </div>
      <div class="rate">Tasa: ${esc(rateText(l))}${l.ins > 0 ? ' · Seguro por cuota: ' + money(l.ins) : ''}</div>
      <div class="plabel"><span>Capital amortizado</span><b>${i.pct.toFixed(1)}%</b></div>
      <div class="progress ${i.pct >= 100 ? 'green' : ''}"><div style="width:${i.pct}%"></div></div>
      <div class="split"><div><span>Abonado a capital</span><b>${money(i.capital)}</b></div><div><span>Intereses</span><b>${money(i.interest)}</b></div><div><span>Seguro</span><b>${money(i.insurance)}</b></div></div>
      <div class="btns"><button class="btn btn-primary btn-sm" data-a="pay" data-id="${l.id}">+ Registrar pago</button><button class="btn btn-soft btn-sm" data-a="hist" data-id="${l.id}">${ui.hist[l.id] ? 'Ocultar historial' : 'Historial (' + l.payments.length + ')'}</button>${i.balance > 0 ? `<button class="btn btn-soft btn-sm" data-a="simtoggle" data-id="${l.id}">${simSt(l.id).open ? 'Cerrar simulador' : 'Simular abono'}</button>` : ''}</div>
      ${i.balance <= 0 ? '<div class="sub" style="margin-top:10px">✓ Deuda liquidada: no hay saldo para simular.</div>' : ''}
      ${ui.hist[l.id] ? `<div class="hist">${l.payments.length ? `<table><thead><tr><th>Fecha</th><th>Tipo</th><th class="r">Capital</th><th class="r">Int.</th><th class="r">Seguro</th><th></th></tr></thead><tbody>${[...l.payments].sort((a,b) => b.date.localeCompare(a.date)).map(p => `<tr><td>${dShort(p.date)}</td><td>${p.kind === 'extra' ? 'Abono extra' : 'Cuota'}</td><td class="r">${money(p.capital||0)}</td><td class="r">${money(p.interest||0)}</td><td class="r">${money(p.insurance||0)}</td><td class="act"><button class="ico-btn" data-a="delpay" data-l="${l.id}" data-id="${p.id}">✕</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">Sin pagos registrados</div>'}</div>` : ''}
      ${i.balance > 0 && simSt(l.id).open ? simPanelHTML(l) : ''}
    </div>`).join('');
  return dash + `<div class="sec-head"><h3>Mis préstamos</h3><button class="btn btn-primary btn-sm" data-a="add" data-k="loans">+ Nuevo préstamo</button></div>` +
    (S.loans.length ? `<div class="loans">${cards}</div>` : `<div class="card">${emptyBox('Aún no tienes préstamos', 'Agrega tus préstamos (Rappi Pay, Nequi…) y registra cada pago con su capital, intereses y seguro.')}</div>`);
}

/* ----- Metas y bolsillos ----- */
function potCard({p, i}){
  const tgt = i.tgt > 0, avg = avgExpense(), pa = potAccOf(p), oc = potCardOf(p);
  const sub = (p.kind === 'meta'
    ? 'Meta' + (p.deadline ? ' · para el ' + dFull(p.deadline) : ' · sin fecha límite')
    : 'Bolsillo' + (oc ? ' · para pagar ' + esc(oc.name) : tgt ? '' : ' · sin tope'))
    + `<div class="muted" style="font-size:12px;margin-top:3px">${esc(CLS[potCls(p)][0])}</div>` + (pa ? `<div class="ccfrom" style="display:flex;margin-top:4px">${logoHTML(pa)}apartado en ${esc(pa.name)}</div>` : '');
  const lines = [];
  /* Bolsillo para tarjeta (Fase 6): deuda real vs. lo apartado; un pago real de la tarjeta baja este apartado */
  if (oc){ const L = ccInfo(oc).last;
    if (!tgt) lines.push(`<span class="pill ok">${esc(oc.name)} no tiene deuda</span>`);
    else lines.push(i.bal >= i.tgt ? `<div><span class="pill ok">Deuda cubierta</span>${i.bal > i.tgt ? ` Sobran <b>${money(i.bal - i.tgt)}</b>: puedes liberarlos.` : ''}</div>` : `<div>Falta por apartar <b>${money(i.rem)}</b> para cubrir toda la deuda</div>`);
    if (L && L.pending > 0) lines.push(`<div>Extracto pendiente <b>${money(L.pending)}</b> · vence ${dShort(L.due)} ${i.bal >= L.pending ? '<span class="pill ok">cubierto</span>' : `<span class="pill warn">faltan ${money(L.pending - i.bal)}</span>`}</div>`);
    if (!pa) lines.push('<div class="note">Asigna la cuenta donde está este dinero para que el pago de la tarjeta lo descuente solo.</div>');
  }
  if (pa) lines.push(`<div>Saldo real de ${esc(pa.name)}: <b>${money(accInfo(pa).bal)}</b> · reservado en la cuenta <b>${money(reservedOf(pa.id))}</b> · libre <b class="${freeOf(pa) < 0 ? 'neg' : 'pos'}">${money(freeOf(pa))}</b></div>`);
  if (oc){ /* el bolsillo de tarjeta ya mostró su estado arriba */ }
  else if (i.done) lines.push(`<span class="pill ok">✓ Completada${i.doneOn ? ' el ' + dFull(i.doneOn) : ''}</span>`);
  else if (tgt){
    lines.push(`<div>Faltan <b>${money(i.rem)}</b></div>`);
    if (p.deadline){
      lines.push(`<div>${i.overdue ? '<span class="pill bad">Fecha límite vencida</span>' : `Necesitas <b>≈ ${money(i.need)}</b> al mes (${i.mleft} mes${i.mleft === 1 ? '' : 'es'})`}</div>`);
    }
    if (i.eta) lines.push(`<div>Con tu ritmo actual (<b>${money(i.pace)}</b>/mes) la completas hacia <b>${esc(monthName(i.eta))}</b> ${p.deadline ? (i.late ? '<span class="pill warn">llegarías tarde</span>' : '<span class="pill ok">vas a tiempo</span>') : ''}</div>`);
    else if (!i.pace) lines.push('<div>Aún no hay aportes recientes para estimar cuándo la completas.</div>');
  } else if (p.kind === 'bolsillo' && tgt && i.bal >= i.tgt) lines.push('<span class="pill ok">Tope alcanzado</span>');
  if (isEmergency(p)) lines.push(avg > 0 ? `<div>Cubre <b>${dec1(i.bal / avg)} meses</b> de tus gastos (promedio ${money(avg)}/mes)</div>` : '<div>Registra tus gastos para saber cuántos meses cubre.</div>');
  if (p.note) lines.push(`<div>📝 ${esc(p.note)}</div>`);
  const hist = ui.hist[p.id] ? `<div class="hist">${p.tx.length ? `<table><thead><tr><th>Fecha</th><th>Movimiento</th><th class="r">Monto</th><th></th></tr></thead><tbody>${[...p.tx].sort((a,b) => b.date.localeCompare(a.date)).map(t => `<tr><td>${dShort(t.date)}</td><td>${t.opening ? 'Saldo inicial' : t.ccpay ? 'Usado en pago de tarjeta' : t.exp ? 'Usado en un gasto' : t.amount > 0 ? (pa ? 'Apartado' : 'Aporte') : (pa ? 'Liberado' : 'Retiro')}${t.ext && !t.opening ? ' <span class="tag">externo</span>' : ''}<div style="color:var(--muted)">${esc(t.note && !t.opening ? t.note : '')}</div></td><td class="r ${t.amount > 0 ? 'pos' : 'neg'}">${t.amount > 0 ? '+' : '−'} ${money(Math.abs(t.amount)).replace('− ','')}</td><td class="act"><button class="ico-btn" data-a="deltx" data-c="pots" data-p="${p.id}" data-id="${t.id}">✕</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">Sin movimientos</div>'}</div>` : '';
  return `<div class="card pot ${i.done ? 'done' : ''}">
    <div class="ph"><div class="ic" style="background:${p.color}26">${p.icon}</div><div class="pt"><h4>${esc(p.name)}</h4><div class="sub">${sub}</div></div><div>${delBtn('pots', p.id)}</div></div>
    <div class="bal">${money(i.bal)}</div>
    <div class="of">${oc ? (tgt ? `de ${money(i.tgt)} de deuda · ${i.pct.toFixed(0)}%` : 'Sin deuda por cubrir') : tgt ? `de ${money(p.target)} · ${i.pct.toFixed(0)}%` : 'Sin tope · tú decides cuánto guardar'}</div>
    ${tgt ? `<div class="progress ${i.done ? 'green' : ''}"><div style="width:${i.pct}%;${i.done ? '' : 'background:' + p.color}"></div></div>` : ''}
    ${lines.length ? `<div class="pinfo">${lines.join('')}</div>` : ''}
    <div class="btns"><button class="btn btn-primary btn-sm" data-a="potmove" data-id="${p.id}" data-sign="1">${pa ? '+ Apartar' : '+ Aportar'}</button><button class="btn btn-soft btn-sm" data-a="potmove" data-id="${p.id}" data-sign="-1" ${i.bal > 0 ? '' : 'disabled'}>${pa ? 'Liberar' : 'Retirar'}</button><button class="btn btn-soft btn-sm" data-a="hist" data-id="${p.id}">${ui.hist[p.id] ? 'Ocultar historial' : 'Historial (' + p.tx.length + ')'}</button></div>
    ${hist}</div>`;
}

function vPots(kind){
  const isMeta = kind === 'meta', mk = ui.month;
  const list = S.pots.filter(p => p.kind === kind);
  const infos = list.map(p => ({p, i:potInfo(p)}));
  const act = infos.filter(x => !x.i.done), dn = infos.filter(x => x.i.done);
  const saved = sum(infos, x => x.i.bal);
  const monthNet = sum(list, p => sum(p.tx.filter(t => !t.opening && t.date.slice(0,7) === mk), t => t.amount));
  const hist = []; for (let i = 5; i >= 0; i--) hist.push(shift(mk, -i));
  const flow = hist.map(m => ({
    in:sum(list, p => sum(p.tx.filter(t => !t.opening && t.date.slice(0,7) === m && t.amount > 0), t => t.amount)),
    out:sum(list, p => sum(p.tx.filter(t => !t.opening && t.date.slice(0,7) === m && t.amount < 0), t => -t.amount))}));
  const tgtTotal = sum(infos.filter(x => x.i.tgt > 0), x => x.i.tgt);
  const progress = tgtTotal ? sum(infos.filter(x => x.i.tgt > 0), x => Math.min(x.i.bal, x.i.tgt)) / tgtTotal * 100 : 0;
  const avg = avgExpense(), eb = emergencyBal(), hasE = S.pots.some(isEmergency);
  const kpis = isMeta ? `
    ${kpi('Ahorrado en metas', money(saved), `${list.length} meta(s)`, 'neu')}
    ${kpi('Objetivo total', money(tgtTotal), 'Suma de todas tus metas')}
    ${kpi('Avance global', progress.toFixed(0) + '%', '', progress >= 100 ? 'pos' : '')}
    ${kpi('Completadas', `${dn.length} de ${list.length}`, 'Se conservan en tu lista', dn.length ? 'pos' : '')}
    ${kpi('Neto de ' + monthName(mk, true), money(monthNet), 'Aportes − retiros del mes', monthNet < 0 ? 'neg' : '')}` : `
    ${kpi('Total en bolsillos', money(saved), `${list.length} bolsillo(s)`, 'neu')}
    ${kpi('Neto de ' + monthName(mk, true), money(monthNet), 'Aportes − retiros del mes', monthNet < 0 ? 'neg' : '')}
    ${kpi('Gasto mensual promedio', money(avg), 'Gastos + fijos + cuotas (3 meses)')}
    ${kpi('Cobertura de emergencia', hasE && avg > 0 ? dec1(eb / avg) + ' meses' : '—', hasE ? 'Meta: 3 a 6 meses' : 'Aún sin bolsillo 🛟', hasE && avg > 0 && eb / avg >= 3 ? 'pos' : '')}`;
  const banner = isMeta ? '' : `<div class="card" style="margin-bottom:16px"><h3>🛟 Fondo de emergencia <span>Referencia: 3 meses (ingreso estable) · 6 meses (ingreso variable)</span></h3>
    ${avg > 0 ? `<p class="note" style="margin:0 0 10px">Con tus gastos promedio de <b>${money(avg)}</b> al mes, el fondo sugerido es de <b>${money(avg*3)}</b> (3 meses) a <b>${money(avg*6)}</b> (6 meses, lo más prudente si tus ingresos varían, como repartidor o independiente). Guárdalo donde puedas sacarlo el mismo día: cuenta de ahorros o fondo de liquidez, no un CDT largo ni bolsa.</p>
    ${hasE ? `<div class="plabel"><span>Tu fondo cubre ${dec1(eb / avg)} de 6 meses</span><b>${Math.min(100, eb / (avg*6) * 100).toFixed(0)}%</b></div><div class="progress ${eb / avg >= 3 ? 'green' : ''}"><div style="width:${Math.min(100, eb / (avg*6) * 100)}%"></div></div>` : `<button class="btn btn-primary btn-sm" data-a="addpot" data-kind="bolsillo" data-tpl="0">Crear bolsillo de emergencia</button>`}`
    : `<p class="note" style="margin:0">Registra tus gastos del mes y calcularé cuánto necesitas para cubrir 3 a 6 meses.</p>`}</div>`;
  const clsCard = list.length ? `<div class="card" style="margin-bottom:16px"><h3>Por finalidad <span>Cómo está organizado lo ahorrado</span></h3><div class="grid g3" style="margin:0">${Object.entries(CLS).map(([k, x]) => { const xs = infos.filter(y => potCls(y.p) === k); return `<div><div class="muted" style="font-size:12.5px">${esc(x[0])}</div><div class="nwbig" style="font-size:22px;margin:4px 0">${money(sum(xs, y => y.i.bal))}</div><div class="note">${xs.length} ${isMeta ? 'meta(s)' : 'bolsillo(s)'} · ${esc(x[1])}</div></div>`; }).join('')}</div></div>` : '';
  const tplBtns = TEMPLATES[kind].map((t, i) => `<button class="tchip" data-a="addpot" data-kind="${kind}" data-tpl="${i}">${t[0]} ${esc(t[1])}</button>`).join(' ');
  const empty = `<div class="card"><div class="empty"><b>${isMeta ? 'Aún no tienes metas' : 'Aún no tienes bolsillos'}</b>${isMeta ? 'Un viaje, una moto, tus estudios… define cuánto necesitas y ve apartando.' : 'Apartar dinero por propósito: emergencias, gastos de la semana, imprevistos.'}<div class="tchips" style="justify-content:center;margin:14px 0 0">${tplBtns}</div></div></div>`;
  return `
  <div class="grid g5">${kpis}</div>
  ${S.accounts.some(a => !isCredit(a)) ? `<div class="pflag info" style="margin-bottom:16px">Si eliges la cuenta donde está el dinero, ${isMeta ? 'la meta' : 'el bolsillo'} queda como <b>apartado</b>: el dinero sigue en esa cuenta, su saldo y tu patrimonio no cambian, solo deja de estar libre. Crear o aportar a un apartado no es un gasto; el patrimonio solo baja cuando el dinero realmente sale (por ejemplo, al pagar el viaje).${isMeta ? '' : ' Un bolsillo para pagar una tarjeta se descuenta solo cuando registras el pago real.'}</div>` : ''}
  ${banner}
  ${clsCard}
  ${list.length ? `<div class="card" style="margin-bottom:16px"><h3>Aportes y retiros <span>Últimos 6 meses</span></h3>${barChart({labels:hist.map(m => monthName(m, true)), series:[{name:'Aportes', color:'#30b455', values:flow.map(x => x.in)},{name:'Retiros', color:'#ff9f0a', values:flow.map(x => x.out)}], h:180})}<div class="key"><span><i style="background:#30b455"></i>Aportes</span><span><i style="background:#ff9f0a"></i>Retiros</span></div></div>` : ''}
  <div class="sec-head"><h3>${isMeta ? 'En progreso' : 'Mis bolsillos'}</h3><button class="btn btn-primary btn-sm" data-a="addpot" data-kind="${kind}">${isMeta ? '+ Nueva meta' : '+ Nuevo bolsillo'}</button></div>
  ${list.length ? (act.length ? `<div class="pots">${act.map(potCard).join('')}</div>` : `<div class="card" style="margin-bottom:20px">${emptyBox('Todas tus metas están completadas 🎉', 'Crea una nueva cuando quieras.')}</div>`) : empty}
  ${isMeta && dn.length ? `<div class="sec-head"><h3>🏆 Completadas</h3><span class="note">Se quedan aquí hasta que las elimines.</span></div><div class="pots">${dn.map(potCard).join('')}</div>` : ''}`;
}

/* ----- Patrimonio (Fase 7) ----- */
function vPatrimonio(){
  const k = ui.month, asOf = asOfOf(k), nw = networth(k), PF = portfolioAt(asOf), cur = k === todayKey;
  const neg = x => x ? '− ' + money(x).replace('− ', '') : money(0);
  const flags = [];
  if (PF.nNoVal) flags.push(['', `${PF.nNoVal} inversión(es) sin valoración registrada: se cuentan al capital aportado neto, no a precio de mercado, y no tienen rentabilidad calculable.`]);
  if (PF.nStale) flags.push(['', `${PF.nStale} inversión(es) con valor registrado hace más de ${STALE_DAYS} días o con TRM desactualizada.`]);
  if (PF.trm.hasUSD && !PF.trm.set) flags.push(['', 'Tienes dólares sin TRM definida: se valoran a tu tasa de compra. Defínela en Inversiones.']);
  if (PF.trm.hasUSD && PF.trm.set && !PF.trm.date) flags.push(['', 'La TRM registrada no tiene fecha: no se sabe qué tan vigente es.']);
  if (PF.trm.hasUSD && k < todayKey) flags.push(['info', 'Mes pasado: los dólares se convierten con la TRM registrada hoy, no con la de ese mes.']);
  if (k > todayKey) flags.push(['info', 'Mes futuro: proyección con los datos registrados; las valoraciones manuales no se proyectan.']);
  const A = nw.mode === 'acc';   /* Fase 7: con cuentas, el efectivo son los saldos reales y lo apartado ya está dentro */
  const cashV = A ? nw.cash : nw.disp;
  const assetItems = A ? [
    ...(nw.free > 0 ? [{label:'Dinero libre en cuentas', value:nw.free, color:'#5e5ce6'}] : []),
    ...(nw.reserved > 0 ? [{label:'Apartado en cuentas', value:nw.reserved, color:'#bf5af2'}] : []),
    ...(nw.potsExt > 0 ? [{label:'Ahorros fuera de cuentas', value:nw.potsExt, color:'#32ade6'}] : []),
    ...PF.byType.map(x => ({label:x.label, value:x.value, color:x.color}))] : [
    ...(nw.disp > 0 ? [{label:'Efectivo disponible', value:nw.disp, color:'#5e5ce6'}] : []),
    ...(nw.metas > 0 ? [{label:'Metas', value:nw.metas, color:'#30b455'}] : []),
    ...(nw.bols > 0 ? [{label:'Bolsillos', value:nw.bols, color:'#32ade6'}] : []),
    ...PF.byType.map(x => ({label:x.label, value:x.value, color:x.color}))];
  const trmTxt = r => r.i.isUSD ? `${usd(r.i.units)}<small>TRM ${r.i.trm ? money(r.i.trm) : '—'} · ${r.m.trm.set ? 'manual' + (r.m.trm.date ? ', ' + dShort(r.m.trm.date) : ', sin fecha') : 'implícita (compra)'}${r.m.trm.stale ? ' ⚠' : ''}</small>` : 'COP<small>sin conversión</small>';
  const srcTxt = r => r.m.kind === 'accrual' ? 'Estimado con tu tasa<small>no es cotización</small>'
    : r.m.kind === 'cost' ? '<span class="pill warn">Sin valoración</span><small>a capital aportado</small>'
    : r.m.kind === 'fx' ? `Cantidad exacta<small>TRM ${r.m.trm.date ? dShort(r.m.trm.date) + ' (' + ageText(r.m.trm.age) + ')' : r.m.trm.set ? 'sin fecha' : 'sin definir'}${r.m.stale ? ' ⚠' : ''}</small>`
    : `${dShort(r.m.date)}<small>${ageText(r.m.age)}${r.m.stale ? ' · <b class="warnc">desactualizado</b>' : ''}</small>`;
  const body = [...PF.rows.filter(r => !r.i.closed), ...PF.rows.filter(r => r.i.closed)].map(r => {
    const g = r.rz.gainOk ? `<span class="${r.i.gain > 0.5 ? 'pos' : r.i.gain < -0.5 ? 'neg' : ''}">${sg(r.i.gain)}</span><small>${r.i.pct > 0 ? '+' : ''}${r.i.pct.toFixed(1).replace('.', ',')}%</small>` : '<span style="color:var(--muted)">No calculable</span><small>sin valoración</small>';
    const z = !r.rz.gainOk ? '—' : r.rz.rzOk ? `${sg(r.rz.realized)}<small>no realizada ${sg(r.rz.unrealized)}</small>` : `<span style="color:var(--muted)">No calculable</span><small>${esc(r.rz.why)}</small>`;
    return `<tr class="${r.i.closed ? 'cl' : ''}"><td><b>${esc(r.h.name)}</b>${r.i.closed ? ' <span class="pill ok">Cerrada</span>' : ''}<small>${esc((ITYPES[r.h.type] || ITYPES.otro)[0])}${r.h.platform ? ' · ' + esc(r.h.platform) : ''}</small></td>
      <td>${trmTxt(r)}</td><td>${money(r.i.contributed)}${r.i.withdrawn ? `<small>retirado ${money(r.i.withdrawn)}</small>` : ''}</td><td><b>${money(r.i.value)}</b></td><td>${g}</td><td>${z}</td><td>${srcTxt(r)}</td></tr>`;
  }).join('');
  const rzAll = PF.nRz === PF.nCalc && PF.nRz > 0;
  const tot = PF.rows.length ? `<tr class="tot"><td>Total${PF.nCalc < PF.rows.length ? '<small>ganancia solo de las que tienen valoración</small>' : ''}</td><td></td><td>${money(PF.contributed)}${PF.withdrawn ? `<small>retirado ${money(PF.withdrawn)}</small>` : ''}</td><td>${money(PF.value)}</td>
      <td>${PF.nCalc ? sg(PF.gain) + `<small>${PF.pct > 0 ? '+' : ''}${PF.pct.toFixed(1).replace('.', ',')}%</small>` : '—'}</td><td>${PF.nRz ? sg(PF.realized) + `<small>no realizada ${sg(PF.unrealized)}${rzAll ? '' : ' · parcial'}</small>` : '—'}</td><td></td></tr>` : '';
  const usdLine = PF.trm.hasUSD ? `<div class="kv"><span>En dólares (moneda original)</span><b>${usd(PF.usdUnits)} ≈ ${money(PF.usdValue)}</b></div>` : '';
  return `
  ${flags.length ? `<div class="pflags">${flags.map(f => `<div class="pflag ${f[0]}">${f[1]}</div>`).join('')}</div>` : ''}
  <div class="grid g5">
    ${A ? kpi('Saldo real en cuentas', money(nw.cash), `Libre ${money(nw.free)} · apartado ${money(nw.reserved)}`, nw.cash < 0 ? 'neg' : '')
        : kpi('Efectivo disponible', money(nw.disp), 'Saldo del mes, sin ahorros ni inversiones', nw.disp < 0 ? 'neg' : '')}
    ${A ? kpi('Ahorros fuera de cuentas', money(nw.potsExt), 'Metas y bolsillos sin cuenta asociada')
        : kpi('Ahorros en metas', money(nw.metas), `Bolsillos aparte: ${money(nw.bols)}`)}
    ${kpi('Inversiones (valor registrado)', money(nw.inv), S.invest.length ? `${PF.nActive} activa(s) · capital neto ${money(PF.net)}` : 'Sin inversiones')}
    ${kpi('Deudas pendientes', neg(nw.debt + nw.cards), nw.cards ? `Préstamos ${money(nw.debt)} · tarjetas ${money(nw.cards)}` : 'Solo capital, sin intereses futuros', nw.debt + nw.cards > 0 ? 'neg' : '')}
    ${kpi('Patrimonio neto estimado', money(nw.total), `Activos − pasivos${cur ? ', a hoy' : ', al cierre de ' + monthName(k, true)}`, nw.total < 0 ? 'neg' : 'pos')}
  </div>
  <div class="grid g2">
    <div class="card"><h3>Cómo se compone <span>${esc(monthName(k))}</span></h3><div class="eq">
      <div class="sub">Activos contabilizados</div>
      ${A ? `<div class="kv"><span>Saldo real en cuentas</span><b class="${nw.cash < 0 ? 'neg' : ''}">${money(nw.cash)}</b></div>
      <div class="kv"><span style="padding-left:12px">de eso, apartado en metas y bolsillos</span><b class="muted">${money(nw.reserved)}</b></div>
      <div class="kv"><span>Metas y bolsillos fuera de cuentas</span><b>${money(nw.potsExt)}</b></div>`
      : `<div class="kv"><span>Efectivo disponible</span><b class="${nw.disp < 0 ? 'neg' : ''}">${money(nw.disp)}</b></div>
      <div class="kv"><span>Metas</span><b>${money(nw.metas)}</b></div>
      <div class="kv"><span>Bolsillos</span><b>${money(nw.bols)}</b></div>`}
      <div class="kv"><span>Inversiones (valor registrado)</span><b>${money(nw.inv)}</b></div>
      <div class="kv tot"><span>Total activos</span><b>${money(nw.assets)}</b></div>
      <div class="sub">Pasivos contabilizados</div>
      <div class="kv"><span>Préstamos (capital pendiente)</span><b class="neg">${neg(nw.debt)}</b></div>
      <div class="kv"><span>Tarjetas de crédito (deuda)</span><b class="neg">${neg(nw.cards)}</b></div>
      <div class="kv tot"><span>Patrimonio neto estimado</span><b class="${nw.total < 0 ? 'neg' : ''}">${money(nw.total)}</b></div></div>
      <p class="note" style="margin:10px 0 0">${A ? 'Cada peso se cuenta una sola vez: lo apartado sigue dentro de su cuenta; lo que inviertes sale de una cuenta y pasa a la inversión.' : 'Cada peso se cuenta una sola vez: lo que aportas a una meta o inversión sale de tu efectivo y pasa a ese activo.'}</p></div>
    <div class="card"><h3>¿De qué está hecho tu patrimonio? <span>Activos</span></h3>${assetItems.length ? donut(assetItems, money(sum(assetItems, x => x.value)).replace('$ ', '$'), 'en activos') : emptyBox('Sin activos positivos', 'Aún no hay efectivo, ahorros ni inversiones con saldo.')}
      ${cashV < 0 ? '<p class="note" style="margin:10px 0 0">Tu efectivo es negativo: no aparece en el gráfico, pero sí se resta del patrimonio.</p>' : ''}</div>
  </div>
  ${A && nw.reserved > 0 ? `<div class="card" style="margin-bottom:16px"><h3>Dinero apartado <span>ya está dentro del saldo de tus cuentas</span></h3><div class="grid g3" style="margin:0">${Object.entries(CLS).map(([k, x]) => `<div><div class="muted" style="font-size:12.5px">${esc(x[0])}</div><div class="nwbig" style="font-size:22px;margin:4px 0">${money(sum(S.pots.filter(p => potAccOf(p) && potCls(p) === k), p => potBalAt(p, asOf)))}</div><div class="note">${esc(x[1])}</div></div>`).join('')}</div><p class="note" style="margin:12px 0 0">Los apartados organizan dinero que ya cuentas una vez en tus cuentas: crearlos no sube ni baja tu patrimonio. Un apartado llamado “Moto” sigue siendo efectivo hasta que realmente lo gastes; solo entonces sale de tus cuentas.</p></div>` : ''}
  <div class="card" style="margin-bottom:16px"><h3>Inversiones: aportado vs. valor registrado <span>${cur ? 'A hoy' : 'Al cierre de ' + esc(monthName(k, true))}</span></h3>
    ${PF.rows.length ? `<div style="overflow-x:auto"><table class="ptbl"><thead><tr><th>Inversión</th><th>Moneda original y tasa</th><th>Capital aportado</th><th>Valor registrado (COP)</th><th>Ganancia / pérdida</th><th>Realizada</th><th>Valor al</th></tr></thead><tbody>${body}${tot}</tbody></table></div>
    <div class="grid g2" style="margin-top:14px">
      <div><h5 style="margin:0 0 6px">Por tipo de inversión</h5>${PF.byType.length ? donut(PF.byType.map(x => ({label:x.label, value:x.value, color:x.color})), money(sum(PF.byType, x => x.value)).replace('$ ', '$'), 'invertido') : '<div class="empty">Sin inversiones activas</div>'}</div>
      <div><h5 style="margin:0 0 6px">Por moneda</h5><div class="kv"><span>En pesos (COP)</span><b>${money(PF.value - PF.usdValue)}</b></div>${usdLine || '<div class="kv"><span>En dólares</span><b>—</b></div>'}</div></div>`
    : emptyBox('Sin inversiones registradas', 'Agrega tus inversiones para ver su composición y rentabilidad.')}</div>
  <details class="card"><summary>Fórmulas y límites de estos cálculos</summary><div class="body">
    <ul><li><b>Patrimonio neto estimado</b> = ${A ? 'saldo real de tus cuentas (ya incluye lo apartado) + metas y bolsillos sin cuenta + valor registrado de inversiones − capital pendiente de préstamos − deuda de tarjetas. Antes de la fecha inicial de tus cuentas se usa el método anterior.' : 'efectivo + metas + bolsillos + valor registrado de inversiones − capital pendiente de préstamos − deuda de tarjetas.'}</li>
    <li><b>Deudas:</b> solo el capital pendiente; los intereses y seguros futuros no se cuentan hasta que se paguen.</li>
    <li><b>Ganancia total</b> = valor registrado + retirado − aportado. Un retiro solo devuelve capital: no suma como rendimiento.</li>
    <li><b>Realizada / no realizada</b> (costo promedio): cada retiro saca del costo la fracción retirada del valor que tenía la posición. Realizada = retirado − costo sacado; no realizada = valor − costo restante. Solo se calcula si había una valoración antes de cada retiro (CDT y dólares se consideran valorados). En una posición cerrada todo el resultado es realizado.</li>
    <li><b>Sin valoración:</b> la inversión se cuenta al capital aportado neto y no tiene rentabilidad calculable. La app no consulta precios: todo valor manual es el que registraste y se marca como desactualizado después de ${STALE_DAYS} días.</li>
    <li><b>CDT:</b> el valor es un estimado con la tasa que registraste (interés compuesto hasta hoy), no una cotización.</li>
    <li><b>Dólares:</b> valor = dólares × TRM manual. Si no hay TRM se usa tu tasa de compra y no se calcula ganancia. La TRM es única (no hay histórico por fecha), así que en meses pasados se usa la actual.</li>
    <li><b>Límites del historial:</b> no hay lotes ni comisiones; los retiros sin valoración previa y las valoraciones del mismo día de un movimiento se interpretan en el orden en que se registraron.</li></ul></div></details>`;
}

/* ----- Inversiones ----- */
const sg = n => (n > 0.5 ? '+ ' : n < -0.5 ? '− ' : '') + money(Math.abs(n)).replace('− ','');
function valSrc(m){
  if (m.kind === 'accrual') return 'Valor estimado con tu tasa registrada · no es una cotización';
  if (m.kind === 'cost') return '<span class="pill warn">Sin valoración</span> Se muestra el capital aportado, no un precio de mercado';
  if (m.kind === 'fx') return 'Cantidad exacta según tus compras y ventas';
  return `Valor registrado a mano el ${dFull(m.date)} (${ageText(m.age)}) ${m.stale ? '<span class="pill warn">Desactualizado</span>' : ''}`;
}
function invCard({h, i, m, rz}){
  const t = ITYPES[h.type] || ITYPES.otro;
  const gcls = i.gain > 0.5 ? 'pos' : i.gain < -0.5 ? 'neg' : '';
  const gs = i.gain > 0.5 ? '+' : i.gain < -0.5 ? '−' : '';
  let badge = '';
  if (i.closed) badge = '<span class="pill ok">Cerrada</span>';
  else if (h.type === 'cdt' && i.end) badge = i.matured ? '<span class="pill bad">Vencido</span>' : `<span class="pill info">Vence en ${i.daysLeft} d</span>`;
  const cdt = h.type === 'cdt' ? `
    <div class="plabel"><span>Tiempo transcurrido</span><b>${i.elapsed.toFixed(0)}%</b></div><div class="progress"><div style="width:${i.elapsed}%;background:${t[2]}"></div></div>
    <div class="meta"><div><span>Tasa E.A.</span><b>${esc(i.rate)}%</b></div><div><span>Plazo</span><b>${i.term} días</b></div>
    <div><span>Vencimiento</span><b>${i.end ? dFull(i.end) : '—'}</b></div><div><span>Al vencer (bruto)</span><b>${money(i.finalGross)}</b></div>
    <div><span>Neto estimado*</span><b>${money(i.finalNet)}</b></div></div>` : '';
  const usdLine = i.isUSD ? `<div class="of">${usd(i.units)} (moneda original) · TRM ${i.trm ? money(i.trm) : '—'} · ${m.trm.set ? 'manual' + (m.trm.date ? ', ' + dFull(m.trm.date) + ' (' + ageText(m.trm.age) + ')' : ', sin fecha') + (m.trm.stale ? ' <span class="pill warn">TRM desactualizada</span>' : '') : 'implícita (tu tasa de compra); define la TRM'}</div>` : '';
  const gainLine = rz.gainOk
    ? `<div class="of">Aportado ${money(i.net)} · <b class="${gcls}">${gs} ${money(Math.abs(i.gain)).replace('− ','')} (${gs}${Math.abs(i.pct).toFixed(1).replace('.',',')}%)</b></div>`
    : `<div class="of">Aportado ${money(i.net)} · <b>Rentabilidad no calculable sin valoración</b></div>`;
  const rzLine = !rz.gainOk ? '' : i.closed ? `<div class="of">Resultado realizado (posición cerrada): <b>${sg(rz.realized)}</b></div>`
    : rz.rzOk ? `<div class="of">Realizada <b>${sg(rz.realized)}</b> · No realizada <b>${sg(rz.unrealized)}</b></div>` : `<div class="of">Realizada / no realizada: no calculable</div>`;
  const hist = ui.hist[h.id] ? `<div class="hist">${h.tx.length ? `<table><thead><tr><th>Fecha</th><th>Movimiento</th><th class="r">Monto</th><th></th></tr></thead><tbody>${[...h.tx].sort((a,b) => b.date.localeCompare(a.date)).map(x => `<tr><td>${dShort(x.date)}</td><td>${x.op === 'aporte' ? 'Aporte' : x.op === 'retiro' ? 'Retiro' : 'Valor'}${x.ext ? ' <span class="tag">externo</span>' : ''}<div style="color:var(--muted)">${esc(x.note)}</div></td><td class="r">${x.op === 'valor' ? (h.currency === 'USD' ? usd(x.value) : money(x.value)) : money(x.amount) + (x.usd ? '<div style="color:var(--muted)">' + usd(x.usd) + '</div>' : '')}</td><td class="act"><button class="ico-btn" data-a="deltx" data-c="invest" data-p="${h.id}" data-id="${x.id}">✕</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">Sin movimientos</div>'}</div>` : '';
  return `<div class="card pot ${i.closed ? 'closed' : ''}">
    <div class="ph"><div class="ic" style="background:${t[2]}26">${t[1]}</div><div class="pt"><h4>${esc(h.name)}</h4><div class="sub">${esc(t[0])}${h.platform ? ' · ' + esc(h.platform) : ''}</div>${badge ? `<div style="margin-top:6px">${badge}</div>` : ''}</div><div>${delBtn('invest', h.id)}</div></div>
    <div class="bal">${money(i.value)}</div>
    ${usdLine}
    ${gainLine}${rzLine}
    <div class="of">${valSrc(m)}</div>
    ${cdt}
    ${h.note ? `<div class="pinfo"><div>📝 ${esc(h.note)}</div></div>` : ''}
    <div class="btns">${h.type === 'cdt' ? '' : `<button class="btn btn-primary btn-sm" data-a="invtx" data-id="${h.id}" data-op="aporte">+ Aportar</button>`}<button class="btn btn-soft btn-sm" data-a="invtx" data-id="${h.id}" data-op="retiro">${h.type === 'cdt' ? 'Redimir' : 'Retirar'}</button>${h.type === 'cdt' ? '' : `<button class="btn btn-soft btn-sm" data-a="invtx" data-id="${h.id}" data-op="valor">Actualizar valor</button>`}<button class="btn btn-soft btn-sm" data-a="hist" data-id="${h.id}">${ui.hist[h.id] ? 'Ocultar historial' : 'Historial (' + h.tx.length + ')'}</button></div>
    ${hist}</div>`;
}

function insights(infos){
  const out = [], avg = avgExpense(), eb = emergencyBal(), hasE = S.pots.some(isEmergency);
  const act = infos.filter(x => !x.i.closed), total = sum(act, x => x.i.value);
  if (!hasE) out.push(['⚠️', 'Aún no tienes un fondo de emergencia. Crea un bolsillo 🛟 antes de aumentar tus inversiones, sobre todo en renta variable.']);
  else if (avg > 0){ const m = eb / avg; out.push(m < 3 ? ['⚠️', `Tu fondo de emergencia cubre ${dec1(m)} meses. El mínimo recomendado es 3 (6 si tus ingresos son variables).`] : ['✅', `Tu fondo de emergencia cubre ${dec1(m)} meses de gastos.`]); }
  else out.push(['ℹ️', 'Registra tus gastos para calcular cuántos meses cubre tu fondo de emergencia.']);
  if (act.length > 1 && total > 0){ const top = act.reduce((a, x) => x.i.value > a.i.value ? x : a); const sh = top.i.value / total * 100; if (sh > 50) out.push(['⚠️', `“${top.h.name}” concentra el ${sh.toFixed(0)}% de tu portafolio. Diversificar reduce el riesgo.`]); }
  act.filter(x => x.h.type === 'cdt' && x.i.end).forEach(x => {
    if (x.i.matured) out.push(['⚠️', `El CDT “${x.h.name}” ya venció: redímelo o renuévalo para que no quede sin rendir.`]);
    else if (x.i.daysLeft <= 30) out.push(['ℹ️', `El CDT “${x.h.name}” vence en ${x.i.daysLeft} días.`]);
  });
  if (act.some(x => x.i.isUSD) && !(S.settings.trm > 0)) out.push(['ℹ️', 'Tienes inversiones en dólares: define la TRM para ver su valor real en pesos.']);
  else if (act.some(x => x.i.isUSD) && act[0] && S.settings.trm > 0 && act.find(x => x.i.isUSD).m.trm.stale) out.push(['⚠️', `La TRM registrada está desactualizada o no tiene fecha (límite ${STALE_DAYS} días): actualízala para valorar tus dólares.`]);
  const nv = act.filter(x => x.m.kind === 'cost').length, st = act.filter(x => x.m.stale).length;
  if (nv) out.push(['ℹ️', `${nv} inversión(es) sin valoración registrada: se muestran al capital aportado. Usa «Actualizar valor» para ver su rentabilidad.`]);
  if (st) out.push(['⚠️', `${st} inversión(es) con valor registrado hace más de ${STALE_DAYS} días: actualízalo antes de tomar decisiones.`]);
  const rv = sum(act.filter(x => x.h.type === 'bolsa'), x => x.i.value);
  if (total > 0 && rv / total > 0.3) out.push(['ℹ️', `La renta variable pesa el ${(rv / total * 100).toFixed(0)}% de tu portafolio. Úsala solo con dinero que no necesites en menos de 1 año.`]);
  if (!infos.length) out.push(['ℹ️', 'Empieza simple: fondo de emergencia primero, luego liquidez o CDT para metas cortas y, solo después, renta variable para largo plazo.']);
  return out;
}

function vInversiones(){
  const PF = portfolioAt(todayStr), infos = PF.rows;
  const act = infos.filter(x => !x.i.closed), closed = infos.filter(x => x.i.closed);
  const value = sum(act, x => x.i.value), net = PF.net, gain = PF.gain, pct = PF.pct;

function firebasePlatform(){

  };

  const dref = (m, uid, id) => m.fs.doc(m.db, 'users', uid, 'data', id);
  const plain = d => { const o = {...d}; ['createdAt'].forEach(k => { if (o[k] && o[k].toMillis) o[k] = o[k].toMillis(); }); return o; };
  const toUser = u => u ? { uid:u.uid, email:u.email, emailVerified:u.emailVerified, createdAt:u.metadata && u.metadata.creationTime ? Date.parse(u.metadata.creationTime) : 0 } : null;
  const getProfile = async uid => { const m = await load(), sn = await m.fs.getDoc(uref(m, uid)); return sn.exists() ? { uid, ...plain(sn.data()) } : null; };
  return {
    kind:'firebase',

    auth:{
      async onChange(cb){ const m = await load(); return m.au.onAuthStateChanged(m.auth, u => cb(toUser(u)), () => cb(null)); },
      async signUp(email, pw){ const m = await load(); const c = await m.au.createUserWithEmailAndPassword(m.auth, email, pw); return toUser(c.user); },
      async signIn(email, pw){ const m = await load(); const c = await m.au.signInWithEmailAndPassword(m.auth, email, pw); return toUser(c.user); },
      async signOut(){ const m = await load(); await m.au.signOut(m.auth); },
      async reset(email){ const m = await load(); await m.au.sendPasswordResetEmail(m.auth, email); },
      async verify(){ const m = await load(); await m.au.sendEmailVerification(m.auth.currentUser); },
      async refresh(){ const m = await load(); await m.auth.currentUser.reload(); return toUser(m.auth.currentUser); },
    },
    db:{
      getProfile,
      /* El cliente NUNCA decide su rol: siempre se crea como usuario activo (las reglas lo exigen). El administrador inicial se asigna a mano en la consola. */
      async createProfile(uid, p){ const m = await load();
        await m.fs.setDoc(uref(m, uid), { name:p.name, email:p.email, role:'user', status:'active', activities:p.activities || [], onboarded:false, theme:p.theme || 'auto', createdAt:m.fs.serverTimestamp() });

      async updateProfile(uid, fields){ const m = await load(); await m.fs.updateDoc(uref(m, uid), fields); },
      async listProfiles(){ const m = await load(), sn = await m.fs.getDocs(m.fs.collection(m.db, 'users')); return sn.docs.map(d => ({ uid:d.id, ...plain(d.data()) })); },
      async read(uid, id){ const m = await load(), sn = await m.fs.getDoc(dref(m, uid, id)); return sn.exists() ? sn.data() : null; },
      /* getDoc + setDoc con comprobación de versión: si otro dispositivo guardó antes, no se pisa. Copia automática de seguridad como máximo cada ~20 h. */
      async write(uid, id, data, expected){
        const m = await load(), r = dref(m, uid, id), sn = await m.fs.getDoc(r), cur = sn.exists() ? sn.data() : null, curTs = cur ? (cur.updatedAt || 0) : 0;
        if (curTs !== expected) return { conflict:true, remote:cur };
        const now = Date.now(), ts = Math.max(now, curTs + 1);
        if (id === 'main' && cur && cur.data){
          try { const rb = dref(m, uid, 'backup'), bs = await m.fs.getDoc(rb); if (!bs.exists() || now - (bs.data().at || 0) > 72e6) await m.fs.setDoc(rb, { data:cur.data, at:now, of:curTs, v:3 }); } catch(e){}
        }
        await m.fs.setDoc(r, { data, updatedAt:ts, v:3 });
        return { ok:true, ts };

async function onAuth(user){

    const was = !!session.user, expired = was && !session.explicit;
    session.user = null; teardown(); session.explicit = false; session.pending = {};
    showGate(expired ? 'signin' : 'welcome', expired ? { notice:'Tu sesión terminó o expiró. Inicia sesión de nuevo.' } : {});
    return;

  if (session.user && session.user.uid === user.uid && session.profile){ session.user = user; renderBanners(); return; }
  session.user = user; await loadProfileAndProceed(seq);
}
async function loadProfileAndProceed(seq){

    let p = await withTimeout(platform.db.getProfile(session.user.uid), 15000);
    if (seq !== authSeq) return;
    if (!p){
      const pe = session.pending || {};
      p = await platform.db.createProfile(session.user.uid, { name:pe.name || (session.user.email || '').split('@')[0], email:session.user.email, activities:[], theme:'auto' });
      if (pe.verify) platform.auth.verify().catch(() => {});

    }
    if (seq !== authSeq) return;

    if (p.status === 'disabled'){ cloud.stop(); showGate('disabled'); return; }

    await enterApp(seq);

}

  catch(e){ if (seq === authSeq) showGate('error', { msg:/datos-ilegibles/.test(e && e.message) ? 'Tus datos en la nube no se pudieron leer. No se modificó nada.' : (isPerm(e) ? 'Tu acceso a los datos fue denegado. Si el administrador desactivó tu cuenta, espera a que la reactive.' : why(e)) }); return; }

}

/* ---------- Migración controlada de los datos anteriores (solo administrador) ---------- */
const djb = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(16); };
function fingerprint(d){
  const sm = (a, f) => a.reduce((t, x) => t + (f(x) || 0), 0);
  const rows = [['Ingresos extra', d.extras.length], ['Jornadas de repartidor', d.rides.length], ['Gastos', d.expenses.length], ['Gastos fijos', d.fixed.length],
    ['Pagos de gastos fijos', Object.values(d.fixedPaid).reduce((t, m) => t + Object.keys(m || {}).length, 0)], ['Préstamos', d.loans.length],
    ['Pagos de préstamos', sm(d.loans, l => l.payments.length)], ['Metas y bolsillos', d.pots.length], ['Movimientos de metas y bolsillos', sm(d.pots, p => p.tx.length)],
    ['Inversiones', d.invest.length], ['Movimientos de inversiones', sm(d.invest, h => h.tx.length)], ['Brokers', d.brokers.length], ['Cuentas y tarjetas', d.accounts.length],
    ['Extractos', d.ccStmts.length], ['Pagos de tarjeta', d.ccPays.length], ['Transferencias', d.transfers.length], ['Ingresos fijos', d.recInc.length], ['Saldos iniciales de mes', Object.keys(d.months).length],
    ['Suma de ingresos extra ($)', sm(d.extras, x => x.amount)], ['Suma de gastos ($)', sm(d.expenses, x => x.amount)], ['Suma de capital pagado ($)', sm(d.loans, l => sm(l.payments, p => p.capital))],
    ['Suma de movimientos de bolsillos ($)', sm(d.pots, p => sm(p.tx, t => t.amount))]];
  return { rows, hash:djb(JSON.stringify(d)) };
}
function describeLegacy(leg){
  const lf = legacyFixed;
  try { const d = normalize(JSON.parse(leg.data)); legacyFixed = lf; return { summary:`${d.expenses.length} gastos, ${d.extras.length + d.rides.length} ingresos, ${d.loans.length} préstamos, ${d.pots.length} metas y bolsillos, ${d.invest.length} inversiones` }; }
  catch(e){ return { summary:'no se pudo leer su contenido' }; }
}
function downloadFile(name, text){ const b = new Blob([text], { type:'application/json' }), u = URL.createObjectURL(b), a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000); }
async function runMigration(){
  const uid = session.user.uid, say = m => showGate('loading', { msg:m });
  if (!isAdmin()) throw new Error('Solo el administrador puede migrar los datos anteriores');
  say('Leyendo los datos anteriores…');
  const leg = await platform.db.readLegacy(LEGACY_DOC); if (!leg || !leg.data) throw new Error('No se encontraron datos anteriores');
  let parsed; try { parsed = JSON.parse(leg.data); } catch(e){ throw new Error('el documento anterior no es un JSON válido'); }
  const src = fingerprint(normalize(parsed)); legacyFixed = false;
  say('Guardando un respaldo verificable…');
  await platform.db.put(uid, 'legacy', { data:leg.data, at:Date.now(), of:leg.updatedAt || 0, v:3 });
  const bk = await platform.db.read(uid, 'legacy'); if (!bk || bk.data !== leg.data) throw new Error('el respaldo no coincide con el original');
  downloadFile(`finanzas-respaldo-anterior-${todayStr}.json`, leg.data);
  say('Copiando los datos a tu cuenta…');
  if (!(await cloud.flush())) throw new Error('hay cambios sin guardar');
  if (hasData(S)) await savePrebackup('migración');
  const prev = S; S = normalize(JSON.parse(leg.data)); legacyFixed = false; cloud.dirty = true; await cloud.push();
  if (cloud.dirty){ clearTimeout(cloud.timer); cloud.again = false; S = prev; cloud.dirty = false; throw new Error('no se pudo guardar en la nube'); }
  say('Verificando cantidades y totales…');
  const back = await platform.db.read(uid, 'main'); if (!back) throw new Error('no se encontró lo migrado');
  const dst = fingerprint(normalize(JSON.parse(back.data)));
  const rows = src.rows.map((r, i) => [r[0], r[1], dst.rows[i][1]]), ok = src.hash === dst.hash && rows.every(r => r[1] === r[2]);
  try { await platform.db.updateProfile(uid, { migratedAt:Date.now() }); session.profile.migratedAt = Date.now(); } catch(e){}
  showGate('migdone', { report:{ ok, rows:rows.filter(r => r[1] || r[2]) } });
}

/* ---------- Datos y respaldos (Fase 6) ---------- */
const EXPORT_FORMAT = 'finanzas-export', EXPORT_VERSION = 4, IMPORT_MAX = 8e6;
const COLLS = [['extras', 'Ingresos extra'], ['rides', 'Jornadas de repartidor'], ['expenses', 'Gastos'], ['fixed', 'Gastos fijos'], ['loans', 'Préstamos'], ['pots', 'Metas y bolsillos'],
  ['invest', 'Inversiones'], ['brokers', 'Brokers'], ['accounts', 'Cuentas y tarjetas'], ['ccStmts', 'Extractos'], ['ccPays', 'Pagos de tarjeta'], ['recInc', 'Ingresos fijos'], ['transfers', 'Transferencias']];
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const num = x => typeof x === 'number' && Number.isFinite(x);
const clone = x => JSON.parse(JSON.stringify(x));
/* El envoltorio de exportación NUNCA incluye contraseñas, tokens ni correo: solo una referencia corta del origen y los datos de la persona. */
function buildExport(){
  return { format:EXPORT_FORMAT, version:EXPORT_VERSION, app:'finanzas', exportedAt:new Date().toISOString(),
    source:{ userRef:session.user.uid.slice(0, 6) + '…', name:session.profile.name },
    profile:{ activities:actsOf(), theme:document.documentElement.dataset.themepref || 'auto' },
    data:clone(S) };
}
/* Valida el archivo SIN tocar tus datos. Devuelve errores (bloquean), avisos y, si es válido, los datos ya normalizados. */
function parseImport(text){
  const r = { errors:[], warnings:[], kind:'', version:null, exportedAt:'', data:null, rows:[] };
  if (text.length > IMPORT_MAX){ r.errors.push('El archivo es demasiado grande (máximo 8 MB).'); return r; }
  let obj; try { obj = JSON.parse(text); } catch(e){ r.errors.push('El archivo no es un JSON válido (está corrupto o incompleto).'); return r; }
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)){ r.errors.push('La estructura no es reconocida: se esperaba un objeto con tus datos.'); return r; }
  let data;
  if (obj.format === EXPORT_FORMAT){
    r.kind = 'Exportación de Finanzas'; r.version = obj.version; r.exportedAt = obj.exportedAt || '';
    if (!num(obj.version)) r.errors.push('Falta la versión del formato.');
    else if (obj.version > EXPORT_VERSION) r.errors.push(`El archivo es de una versión más nueva (${obj.version}); esta aplicación entiende hasta la ${EXPORT_VERSION}. Actualiza la aplicación.`);
    else if (obj.version < 1) r.errors.push('La versión del formato no es válida.');
    if (!obj.data || typeof obj.data !== 'object' || Array.isArray(obj.data)) r.errors.push('El archivo no contiene la sección «data» con tus datos.');
    data = obj.data;
  } else if (Array.isArray(obj.extras) && Array.isArray(obj.expenses)){
    r.kind = 'Respaldo anterior (sin envoltorio)'; r.version = 0; data = obj;
    r.warnings.push('Es un respaldo del formato anterior: no indica la fecha de exportación.');
  } else { r.errors.push('No reconozco el archivo: no parece un respaldo de Finanzas.'); return r; }
  if (r.errors.length) return r;
  const bad = (m) => { if (r.errors.length < 8) r.errors.push(m); };
  COLLS.forEach(([k, label]) => {
    const a = data[k];
    if (a === undefined){ if (k === 'extras' || k === 'expenses') bad(`Falta la colección «${label}».`); else r.warnings.push(`El archivo no trae «${label}» (quedará vacía).`); return; }
    if (!Array.isArray(a)){ bad(`«${label}» debe ser una lista.`); return; }
    const seen = new Set();
    a.forEach((x, i) => {
      const w = `${label} #${i + 1}`;
      if (!x || typeof x !== 'object' || Array.isArray(x)) return bad(`${w}: no es un registro válido.`);
      if (typeof x.id !== 'string' || !x.id) return bad(`${w}: no tiene identificador.`);
      if (seen.has(x.id)) return bad(`${w}: identificador repetido (${x.id}).`); seen.add(x.id);
      const dateOk = (v, what) => { if (v !== undefined && !(typeof v === 'string' && DATE_RE.test(v))) bad(`${w}: ${what || 'fecha'} no válida.`); };
      const amtOk = (v, what) => { if (v !== undefined && !num(v)) bad(`${w}: ${what || 'monto'} no es un número.`); };

    this.ready = true;
    if (legacyFixed){ this.dirty = true; this.schedule(); legacyFixed = false; }
    try { this.unsub = await this.be.listen(raw2 => { if (gen !== this.gen || !raw2 || raw2.updatedAt <= this.last || this.dirty || this.busy) return; if (this.adopt(raw2)) toast('Actualizado desde otro dispositivo'); }); } catch(e){}
    if (gen !== this.gen){ try { this.unsub && this.unsub(); } catch(e){} return null; }
    return { fresh:!raw };
  },
};
window.addEventListener('online', () => { if (cloud.ready && cloud.dirty) cloud.schedule(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && cloud.ready && cloud.dirty) cloud.push(); });
window.addEventListener('beforeunload', e => { if (cloud.ready && (cloud.dirty || cloud.busy)){ e.preventDefault(); e.returnValue = ''; } });

/* Barra del título: toma fondo solo cuando hay contenido desplazado debajo (en móvil el que desplaza puede ser body). */
const toolbarEl = document.querySelector('.toolbar');
const syncToolbar = () => toolbarEl.classList.toggle('stuck', Math.max(window.scrollY, document.body.scrollTop, document.documentElement.scrollTop) > 4);
document.addEventListener('scroll', syncToolbar, { capture:true, passive:true });
syncToolbar();

boot();

})();
</script>
